<text x="700" y="244" text-anchor="start" font-size="12" fill="#8b949e">que usa el navegador</text>
<rect x="730" y="272" width="260" height="78" rx="10" fill="#0d2818" stroke="#3fb950" stroke-width="1.8"/><text x="860.0" y="297.0" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e6edf3">PostgreSQL</text><text x="860.0" y="319.0" text-anchor="middle" font-size="12.5" fill="#9198a1">estado de tareas</text><text x="860.0" y="336.0" text-anchor="middle" font-size="12.5" fill="#9198a1">memoria de entidades</text>
<path d="M 556 305 L 724 305" stroke="#3fb950" stroke-width="1.9" fill="none" marker-end="url(#pfG)"/>
<path d="M 724 325 L 556 325" stroke="#3fb950" stroke-width="1.9" fill="none" marker-end="url(#pfG)"/>
<text x="640" y="288" text-anchor="middle" font-size="12" fill="#3fb950" font-weight="600">Prisma</text>
