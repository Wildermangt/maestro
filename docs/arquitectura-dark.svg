<text x="860" y="676" text-anchor="middle" font-size="11.5" fill="#a371f7">opcional: si no está, el investigador sigue</text>
<rect x="160" y="750" width="480" height="104" rx="10" fill="#2d1214" stroke="#f85149" stroke-width="1.8"/><text x="400.0" y="780.0" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e6edf3">Contenedor efímero</text><text x="400.0" y="802.0" text-anchor="middle" font-size="12.5" fill="#f85149">sin red · sin privilegios de kernel · raíz de solo lectura</text><text x="400.0" y="819.0" text-anchor="middle" font-size="12.5" fill="#f85149">límite de memoria y de tiempo</text><text x="400.0" y="836.0" text-anchor="middle" font-size="12.5" fill="#9198a1">uno nuevo por ejecución, y se borra al terminar</text>
<path d="M 400 698 L 400 746" stroke="#f85149" stroke-width="1.9" fill="none" marker-end="url(#pfR)"/>
<text x="414" y="726" text-anchor="start" font-size="11.5" fill="#f85149" font-weight="600">ejecuta el código que genera</text>
<rect x="730" y="744" width="260" height="84" rx="10" fill="#0d2818" stroke="#3fb950" stroke-width="1.8"/><text x="860.0" y="764.0" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e6edf3">Volumen compartido</text><text x="860.0" y="786.0" text-anchor="middle" font-size="12.5" fill="#9198a1">artifacts_data</text><text x="860.0" y="803.0" text-anchor="middle" font-size="12.5" fill="#9198a1">lo escribe el worker,</text><text x="860.0" y="820.0" text-anchor="middle" font-size="12.5" fill="#9198a1">lo sirve el backend</text>
<path d="M 646 686 L 724 760" stroke="#3fb950" stroke-width="1.9" fill="none" marker-end="url(#pfG)"/>
