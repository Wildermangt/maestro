<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 890" width="1060" height="890" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="pf" markerWidth="9" markerHeight="9" refX="8.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker><marker id="pfO" markerWidth="9" markerHeight="9" refX="8.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#a371f7"/></marker><marker id="pfR" markerWidth="9" markerHeight="9" refX="8.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#f85149"/></marker><marker id="pfG" markerWidth="9" markerHeight="9" refX="8.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3fb950"/></marker></defs>
<rect width="1060" height="890" fill="#0d1117"/>
<text x="40" y="44" text-anchor="start" font-size="21" fill="#e6edf3" font-weight="600">Maestro · arquitectura de servicios</text>
<text x="40" y="68" text-anchor="start" font-size="13.5" fill="#9198a1">Siete servicios en Docker Compose. Una sola puerta de entrada y una sola cola.</text>
<rect x="70" y="110" width="250" height="72" rx="10" fill="#121d2f" stroke="#4493f8" stroke-width="1.8"/><text x="195.0" y="140.0" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e6edf3">Navegador</text><text x="195.0" y="162.0" text-anchor="middle" font-size="12.5" fill="#9198a1">Next.js · React</text>
<rect x="560" y="110" width="330" height="72" rx="10" fill="#121d2f" stroke="#4493f8" stroke-width="1.8"/><text x="725.0" y="132.0" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e6edf3">Canales externos</text><text x="725.0" y="154.0" text-anchor="middle" font-size="12.5" fill="#9198a1">Telegram · Gmail · Outlook</text><text x="725.0" y="171.0" text-anchor="middle" font-size="12.5" fill="#9198a1">con remitentes autorizados</text>
<rect x="250" y="272" width="300" height="78" rx="10" fill="#121d2f" stroke="#4493f8" stroke-width="1.8"/><text x="400.0" y="305.0" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e6edf3">backend</text><text x="400.0" y="327.0" text-anchor="middle" font-size="12.5" fill="#9198a1">NestJS · REST + WebSocket</text>
