<path d="M 330 354 L 330 420" stroke="#f85149" stroke-width="1.9" fill="none" marker-end="url(#pfR)"/>
<path d="M 470 420 L 470 354" stroke="#f85149" stroke-width="1.9" fill="none" marker-end="url(#pfR)"/>
<text x="296" y="394" text-anchor="end" font-size="12" fill="#f85149" font-weight="600">encola</text>
<text x="504" y="394" text-anchor="start" font-size="12" fill="#f85149" font-weight="600">resultado</text>
<rect x="160" y="572" width="480" height="122" rx="10" fill="#121d2f" stroke="#4493f8" stroke-width="1.8"/><text x="400.0" y="611.0" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e6edf3">worker · Python</text><text x="400.0" y="633.0" text-anchor="middle" font-size="12.5" fill="#9198a1">El Director descompone la tarea y delega en 10 agentes</text><text x="400.0" y="650.0" text-anchor="middle" font-size="12.5" fill="#9198a1">researcher · analyst · extractor · enricher · verifier</text><text x="400.0" y="667.0" text-anchor="middle" font-size="12.5" fill="#9198a1">writer · presenter · spreadsheet · designer · ingest</text>
<path d="M 330 502 L 330 568" stroke="#f85149" stroke-width="1.9" fill="none" marker-end="url(#pfR)"/>
<path d="M 470 568 L 470 502" stroke="#f85149" stroke-width="1.9" fill="none" marker-end="url(#pfR)"/>
<text x="296" y="542" text-anchor="end" font-size="12" fill="#f85149" font-weight="600">brpoplpush</text>
<text x="504" y="542" text-anchor="start" font-size="12" fill="#f85149" font-weight="600">resultado</text>
<rect x="730" y="578" width="260" height="76" rx="10" fill="#211433" stroke="#a371f7" stroke-width="1.8" stroke-dasharray="7 5"/><text x="860.0" y="602.0" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e6edf3">Qdrant</text><text x="860.0" y="624.0" text-anchor="middle" font-size="12.5" fill="#9198a1">caché semántico</text><text x="860.0" y="641.0" text-anchor="middle" font-size="12.5" fill="#9198a1">perfil «completo»</text>
