<text x="78" y="238" text-anchor="start" font-size="12" fill="#8b949e" font-weight="600">POST /api/tasks</text>
<path d="M 340 268 L 262 186" stroke="#8b949e" stroke-width="1.9" fill="none" marker-end="url(#pf)"/>
<text x="360" y="232" text-anchor="start" font-size="12" fill="#8b949e" font-weight="600">WebSocket</text>
<text x="360" y="248" text-anchor="start" font-size="11.5" fill="#8b949e">árbol en vivo</text>
<path d="M 672 186 L 512 268" stroke="#8b949e" stroke-width="1.9" fill="none" marker-end="url(#pf)"/>
